package:
  name: timagetk
  version: {{ GIT_DESCRIBE_TAG }}

source:
  path: ../../

build:
  number: {{ GIT_DESCRIBE_NUMBER }}
  preserve_egg_dir: True

requirements:
  build:
    - {{ compiler('c') }}
    - setuptools 45.2.0
    - python 3.7.6
    - scons 3.1.1
    - zlib
    - git
  host:
    - python 3.7.6
    - setuptools 45.2.0
    - scons 3.1.1
    - git
    - zlib
    - numpy 1.18.1
    - matplotlib 3.1.3
    - scikit-image 0.16.2
    - imageio 2.6.1
    - Pillow 7.0.0
    - scipy 1.4.1
    - networkx 2.4
    - joblib 0.14.1
  run:
    - python >=3.7,<3.8.0a0
    - zlib
    - numpy >=1.18,<1.19
    - matplotlib >=3.1,<3.2
    - scikit-image >=0.16,<0.17
    - imageio >=2.6,<2.7
    - Pillow >=7.0,<7.1
    - scipy >=1.4,<1.5
    - networkx >=2.4,<2.5
    - joblib >=0.14,<0.15

test:
  source_files:
    - timagetk/test
  requires:
    - nose
  imports:
    - timagetk
  commands:
    - nosetests -w timagetk/test -x -s -v -I testskip*

about:
  home: https://mosaic.gitlabpages.inria.fr/timagetk
  license: Inria
  license_file: ../../../LICENSE.txt
  summary: Tissue Image Toolkit for multicellular image processing.
  dev_url: https://gitlab.inria.fr/mosaic/timagetk
